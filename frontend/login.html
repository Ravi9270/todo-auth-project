<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container">
        <div class="leftside">
            <div class="lscenter">
                <div class="logo">
                    <img src="../img/logo.png" alt="logo">
                </div>

                <p>
                    See everyday moments from <br>
                    your <span>close friends.</span>
                </p>

                <img class="lscenterbg" src="../img/left_bg.webp" alt="img">
            </div>
        </div>

        <div class="rightside">
            <div class="login">

                <p class="title">Log into Instagram</p>

                <form>

                    <input
                        id="username"
                        type="text"
                        placeholder="Mobile number, username or email"
                    >

                    <input
                        id="password"
                        type="password"
                        placeholder="Password"
                    >

                    <button id="login" type="submit">
                        Log in
                    </button>

                    <p class="forgot">
                        Forgot password?
                    </p>

                    <button type="button" class="facebook">
                        Log in with Facebook
                    </button>

                    <a href="./register.html" class="create">
                        Create new account
                    </a>

                    <p class="meta">
                        Meta
                    </p>

                </form>

            </div>
        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>
