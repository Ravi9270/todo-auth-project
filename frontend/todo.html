<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="todo.css">
</head>

<body>

    <header>

        <div class="logo">
            <img src="../img/logomy.png" alt="logo">
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Contact</a>
            <a href="#">About</a>
        </nav>

        <div class="user">
            <button id="logout">Logout</button>
        </div>

    </header>

    <main>

        <div class="container">

            <form>

                <label for="enter">TASK</label>

                <input
                    id="enter"
                    type="text"
                    placeholder="Enter Task"
                >

                <button id="add">
                    ADD
                </button>

                <ol id="list"></ol>

            </form>

        </div>

    </main>

    <script src="todo.js"></script>

</body>

</html>
